# Production-style: externally managed Secrets, fixed replicas, no migrations.
secrets:
  existingSecret: stellarsorter-backend-env
jwtSigningKeys:
  existingSecret: stellarsorter-backend-jwt-keys
autoscaling:
  enabled: false
replicaCount: 3
migrations:
  enabled: false
extraEnv:
  - name: JWT_ACTIVE_KID
    value: "2026-10"
